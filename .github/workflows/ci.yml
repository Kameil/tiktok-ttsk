name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets
      - name: Fmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/tiktok-ttsk dist/tiktok-ttsk
          chmod +x dist/tiktok-ttsk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-ttsk-linux${{ github.ref_name == 'dev' && '-dev' || '' }}
          path: dist/tiktok-ttsk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/tiktok-ttsk.exe dist/tiktok-ttsk.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-ttsk-windows${{ github.ref_name == 'dev' && '-dev' || '' }}
          path: dist/tiktok-ttsk.exe
          if-no-files-found: error
          retention-days: 14
