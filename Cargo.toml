[package]
name = "tiktok-ttsk"
version = "0.3.2"
edition = "2021"
description = "TikTok Streak Keeper - automatically maintain TikTok conversation streaks"
repository = "https://github.com/Kameil/tiktok-ttsk"
keywords = ["tiktok", "automation", "streak", "messaging"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }
cloak-cdp = "0.3"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
futures = "0.3"
notify-rust = "4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
